{% extends "base.html" %}
{% block content %}
<div class="max-w-4xl mx-auto space-y-6">
    <div><h1 class="text-2xl font-extrabold text-slate-900">Manage Shop Products</h1><p class="text-xs text-slate-500 mt-1">Add products that customers can order from the Farm Shop.</p></div>
    <form method="POST" class="bg-white rounded-2xl border border-slate-200 p-5 grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
        <label class="text-xs font-bold text-slate-500">Product name<input name="name" required placeholder="e.g. A2 Ghee" class="mt-1 w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3 text-sm"></label>
        <label class="text-xs font-bold text-slate-500">Unit<input name="unit" required placeholder="500 ml bottle" class="mt-1 w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3 text-sm"></label>
        <label class="text-xs font-bold text-slate-500">Price (₹)<input name="price" type="number" min="0.01" step="0.01" required class="mt-1 w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3 text-sm"></label>
        <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl py-2.5 text-xs font-bold"><i class="fa-solid fa-plus mr-1"></i> Add Product</button>
    </form>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        {% for product in products %}<div class="bg-white rounded-2xl border border-slate-200 p-5 flex items-center justify-between"><div><h2 class="font-bold text-slate-900">{{ product.name }}</h2><p class="text-xs text-slate-500">₹{{ product.price }} per {{ product.unit }}</p></div><i class="fa-solid {{ product.icon }} text-emerald-600 text-xl"></i></div>{% endfor %}
    </div>
</div>
{% endblock %}
